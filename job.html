<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Latest Tech Hirings</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080a;
    --bg-elevated: #0d0d10;
    --surface: #131317;
    --surface-hover: #1a1a1f;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text-primary: #f2f2f4;
    --text-secondary: #9a9aa4;
    --text-muted: #66666f;
    --accent: #5ea2ff;
    --accent-dim: rgba(94,162,255,0.12);
    --accent-glow: rgba(94,162,255,0.22);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .glow-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(600px circle at 50% -10%, rgba(94,162,255,0.10), transparent 60%),
      radial-gradient(500px circle at 100% 20%, rgba(94,162,255,0.05), transparent 60%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 3.5rem;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .fade { opacity: 0; animation: fadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .fade-1 { animation-delay: 0.02s; }
  .fade-2 { animation-delay: 0.1s; }
  .fade-3 { animation-delay: 0.2s; }
  .fade-4 { animation-delay: 0.3s; }
  .fade-5 { animation-delay: 0.45s; }
  .fade-6 { animation-delay: 0.55s; }

  @media (prefers-reduced-motion: reduce) {
    .fade { animation: none; opacity: 1; }
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    margin-bottom: 2rem;
    transition: color 0.2s ease;
  }

  .back-link:hover { color: var(--accent); }
  .back-link svg { width: 15px; height: 15px; transition: transform 0.2s ease; }
  .back-link:hover svg { transform: translateX(-3px); }

  h1.headline {
    font-size: clamp(1.9rem, 5.5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.14;
    background: linear-gradient(180deg, #ffffff 0%, #c9c9d4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    margin-top: 0.85rem;
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--text-secondary);
    max-width: 460px;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 2.5rem 0 2rem;
  }

  .job-list {
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
  }

  /* Active job card */
  .job-card {
    position: relative;
    background: var(--surface);
    border: 1px solid rgba(94,162,255,0.22);
    border-radius: var(--radius-lg);
    padding: 1.9rem 1.7rem;
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease;
  }

  .job-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 20px 44px -22px rgba(94,162,255,0.3), 0 4px 18px -6px rgba(0,0,0,0.5);
  }

  .job-card::before {
    content: "";
    position: absolute;
    top: -40%; right: -20%;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(94,162,255,0.16), transparent 70%);
    pointer-events: none;
  }

  .job-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .job-company-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0.4rem;
    flex-wrap: wrap;
  }

  .job-company {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .new-badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #08080a;
    background: linear-gradient(120deg, #ffd166, #ffb020);
    padding: 2.5px 8px;
    border-radius: 20px;
    box-shadow: 0 0 10px rgba(255,176,32,0.35);
  }

  .mass-badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(94,162,255,0.14);
    border: 1px solid rgba(94,162,255,0.28);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .job-title {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .badge-live {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    color: #6ee7a0;
    background: rgba(20,64,30,0.35);
    border: 1px solid rgba(110,231,160,0.25);
    padding: 5px 11px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .badge-live .pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #6ee7a0;
    box-shadow: 0 0 6px rgba(110,231,160,0.7);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .job-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.9rem;
    margin-top: 1.4rem;
  }

  @media (min-width: 480px) {
    .job-meta { grid-template-columns: repeat(3, 1fr); }
  }

  .meta-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .meta-item svg {
    width: 16px; height: 16px;
    stroke: var(--accent);
    margin-top: 2px;
    flex-shrink: 0;
    opacity: 0.9;
  }

  .meta-item div p:first-child {
    font-size: 10.5px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }

  .meta-item div p:last-child {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .job-desc {
    margin-top: 1.4rem;
    font-size: 14px;
    line-height: 1.65;
    color: var(--text-secondary);
    padding-top: 1.3rem;
    border-top: 1px solid var(--border);
  }

  .apply-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 1.5rem;
    padding: 13px 20px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: #08080a;
    background: linear-gradient(120deg, var(--accent), #8fc4ff);
    border: none;
    border-radius: var(--radius-sm);
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }

  .apply-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px -10px rgba(94,162,255,0.5);
    filter: brightness(1.05);
  }

  .apply-btn svg { width: 16px; height: 16px; }

  /* Loading / empty / error states for the job list */
  .state-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 2rem 1.5rem;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .spinner {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2.5px solid rgba(94,162,255,0.2);
    border-top-color: var(--accent);
    margin: 0 auto 12px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Upcoming section */
  .section-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1rem;
  }

  .upcoming-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.8rem;
  }

  @media (min-width: 480px) {
    .upcoming-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .upcoming-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 1.1rem 0.9rem;
    text-align: center;
    opacity: 0.55;
    filter: grayscale(0.4);
    position: relative;
    transition: opacity 0.25s ease;
  }

  .upcoming-card:hover { opacity: 0.75; }

  .upcoming-card .company-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.55rem;
  }

  .soon-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-strong);
    padding: 3px 9px;
    border-radius: 20px;
  }

  /* Follow section */
  .social-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.7rem;
  }

  .social-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.8rem 1.05rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    text-decoration: none;
    flex: 1;
    min-width: 160px;
    transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
  }

  .social-card:hover {
    border-color: rgba(94,162,255,0.3);
    background: var(--surface-hover);
    transform: translateY(-2px);
  }

  .social-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: rgba(255,255,255,0.04);
  }

  .social-icon svg { width: 18px; height: 18px; }

  .social-label { font-size: 10.5px; color: var(--text-muted); letter-spacing: 0.03em; text-transform: uppercase; }
  .social-name { font-size: 13.5px; font-weight: 500; color: var(--text-primary); margin-top: 1px; }

  .home-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 2.5rem;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .home-back:hover { color: var(--accent); }
  .home-back svg { width: 16px; height: 16px; transition: transform 0.2s ease; }
  .home-back:hover svg { transform: translateX(-3px); }

  @media (max-width: 420px) {
    .wrap { padding: 2.75rem 1.25rem 3rem; }
  }
</style>
</head>
<body>
<div class="glow-field"></div>

<div class="wrap">

  <a href="index.html" class="back-link fade fade-1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Home
  </a>

  <h1 class="headline fade fade-2">Latest Tech Hirings</h1>
  <p class="sub fade fade-3">Verified opportunities for students & freshers.</p>

  <hr class="divider fade fade-3" />

  <!-- Jobs are rendered here by JavaScript, fetched live from the backend -->
  <div class="job-list fade fade-4" id="jobList">
    <div class="state-box">
      <div class="spinner"></div>
      Loading latest hirings…
    </div>
  </div>

  <p class="section-label fade fade-5" style="margin-top:2.75rem;">Upcoming Hirings</p>

  <div class="upcoming-grid fade fade-5">
    <div class="upcoming-card">
      <p class="company-name">Amazon</p>
      <span class="soon-badge">Soon</span>
    </div>
    <div class="upcoming-card">
      <p class="company-name">Microsoft</p>
      <span class="soon-badge">Soon</span>
    </div>
    <div class="upcoming-card">
      <p class="company-name">Adobe</p>
      <span class="soon-badge">Soon</span>
    </div>
    <div class="upcoming-card">
      <p class="company-name">Salesforce</p>
      <span class="soon-badge">Soon</span>
    </div>
  </div>

  <p class="section-label fade fade-6" style="margin-top:2.75rem;">Follow for daily updates</p>

  <div class="social-row fade fade-6">
    <a href="https://www.instagram.com/anurag24codes/" target="_blank" rel="noreferrer" class="social-card">
      <div class="social-icon" style="background:rgba(224,60,145,0.12);">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="5.5" stroke="#e0509a" stroke-width="1.8"/><circle cx="12" cy="12" r="4.5" stroke="#e0509a" stroke-width="1.8"/><circle cx="17.5" cy="6.5" r="1" fill="#e0509a"/></svg>
      </div>
      <div>
        <p class="social-label">Instagram</p>
        <p class="social-name">@anurag24codes</p>
      </div>
    </a>

    <a href="https://www.youtube.com/@Anurag24tripathi" target="_blank" rel="noreferrer" class="social-card">
      <div class="social-icon" style="background:rgba(220,38,38,0.12);">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="4" stroke="#ea5252" stroke-width="1.8"/><polygon points="10,8.5 16,12 10,15.5" fill="#ea5252"/></svg>
      </div>
      <div>
        <p class="social-label">YouTube</p>
        <p class="social-name">Anurag Tripathi</p>
      </div>
    </a>
  </div>

  <a href="index.html" class="home-back fade fade-6">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Home
  </a>

</div>

<script>
  // ── SET THIS ONCE YOUR BACKEND IS DEPLOYED ──────────────────────────────
  // e.g. "https://jobtracker-backend.onrender.com"
  const API_BASE_URL = "http://localhost:5000";
  // ─────────────────────────────────────────────────────────────────────

  const ICONS = {
    location: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Z"/><circle cx="12" cy="9" r="2.4"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
    briefcase: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    users: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 17 17 7M9 7h8v8"/></svg>',
  };

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    if (!dateStr) return "—";
    const d = new Date(dateStr);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  }

  function isExpired(dateStr) {
    if (!dateStr) return false;
    const d = new Date(dateStr);
    return !isNaN(d) && d < new Date(new Date().toDateString());
  }

  function jobCardHtml(job, delayIndex) {
    const expired = isExpired(job.lastDate);
    return `
      <div class="job-card fade" style="animation-delay:${0.05 * delayIndex}s;">
        <div class="job-top">
          <div>
            <div class="job-company-row">
              <p class="job-company">${escapeHtml(job.company)}</p>
              ${job.isNewListing ? '<span class="new-badge">New</span>' : ""}
              ${job.isMassHiring ? '<span class="mass-badge">Mass Hiring</span>' : ""}
            </div>
            <p class="job-title">${escapeHtml(job.role)}</p>
          </div>
          <span class="badge-live">
            ${expired ? "" : '<span class="pulse"></span>'}
            ${expired ? "Closed" : "Active"}
          </span>
        </div>

        <div class="job-meta">
          <div class="meta-item">
            ${ICONS.location}
            <div><p>Location</p><p>${escapeHtml(job.location) || "—"}</p></div>
          </div>
          <div class="meta-item">
            ${ICONS.calendar}
            <div><p>Last Date</p><p>${formatDate(job.lastDate)}</p></div>
          </div>
          <div class="meta-item">
            ${ICONS.briefcase}
            <div><p>Hiring Type</p><p>${job.isMassHiring ? "Mass Hiring" : "Limited Roles"}</p></div>
          </div>
        </div>

        <p class="job-desc">${escapeHtml(job.description)}</p>

        <a href="${job.applyLink}" target="_blank" rel="noreferrer" class="apply-btn" data-job-id="${job._id}">
          Official Apply Now
          ${ICONS.arrow}
        </a>
      </div>
    `;
  }

  async function loadJobs() {
    const container = document.getElementById("jobList");
    try {
      const res = await fetch(`${API_BASE_URL}/api/jobs`);
      if (!res.ok) throw new Error("Bad response");
      const jobs = await res.json();

      if (!jobs.length) {
        container.innerHTML = `<div class="state-box">No active listings right now — check back soon.</div>`;
        return;
      }

      container.innerHTML = jobs.map((job, i) => jobCardHtml(job, i)).join("");

      // Wire up click tracking on every apply button, without blocking navigation
      container.querySelectorAll(".apply-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const jobId = btn.getAttribute("data-job-id");
          fetch(`${API_BASE_URL}/api/track/click/${jobId}`, { method: "POST" }).catch(() => {});
        });
      });
    } catch (err) {
      container.innerHTML = `<div class="state-box">Couldn't load listings right now. Please refresh the page.</div>`;
    }
  }

  function trackVisit() {
    fetch(`${API_BASE_URL}/api/track/visit`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ page: "landing" }),
    }).catch(() => {});
  }

  loadJobs();
  trackVisit();
</script>

</body>
</html>
